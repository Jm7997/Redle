# Pelipper: el aviso diario del reto en Discord (ver scripts/pelipper.mjs). Una vez al día, a las 23:07 UTC (00:07 en
# España en invierno, 01:07 en verano); GitHub a veces lo lanza con horas de retraso, y el script publica igual. No en
# punto: a esa hora GitHub va saturado. También a mano (Actions → Pelipper → Run workflow): publica el reto de hoy.
name: Pelipper

on:
  schedule:
    - cron: '7 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/pelipper.mjs ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
